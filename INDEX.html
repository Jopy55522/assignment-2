<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Stylessheet.css">
    <title>Jopy Nii Nortei Oku-10022440296</title>
</head>
<body>
    <h2 id="profile-name">Developer Workshop Registration</h2>
    

    <form id = "registration-form">
        <label for="full-name">Full Name:</label>
        <input type="text" id="full-name" name="full-name" required>
        <br />
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
        <br />

        <label for="experience">Level of Experience:</label>
        <select id="experience" name="experience" required>
            <option value="">Select Level</option>
            <option value="beginner">Beginner</option>
            <option value="intermediate">Intermediate</option>
            <option value="advanced">Advanced</option>    
        </select>
        <br />
        <br />
        

        <label for="Workshop-Track">Workshop-Track:</label>
        <br />
        <input type="radio" id="Workshop-Track" name="Workshop-Track" value="web-development" required>
        <label for="web-development">Web Development</label>
        <br />
        <input type="radio" id="Workshop-Track" name="Workshop-Track" value="mobile-development" required>
        <label for="mobile-development">Mobile Development</label>
        <br />
        <input type="radio" id="Workshop-Track" name="Workshop-Track" value="data-science" required>
        <label for="data-science">Data Science</label>
        <br />
        <br />

        <label for="Notifications">Receive Notifications:</label>
        <input type="checkbox" id="Notifications" name="Notifications">
        <br />
        <br />
        

        <a href="#" class="btn">Register Now</a>


    </form>
    
</body>
</html>
